name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Next.js typed routes (LayoutProps, etc.) require generated defs before tsc.
      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Start local Supabase (Auth E2E)
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor

      - name: Export local Supabase publishable env
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          test -n "${API_URL:-}"
          test -n "${ANON_KEY:-}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
          echo "Local Auth URL=$API_URL"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Playwright
        run: pnpm test:e2e --project=chromium-desktop
        env:
          CI: "true"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          # Auth E2E uses local stack from GITHUB_ENV (confirmations off)

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
